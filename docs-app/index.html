<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="react-ui-kit: live catalogue of the personal design system components, tokens, themes and app profiles." />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>react-ui-kit · Design system</title>
    <script>
      // Same logic as themeScript() — applies stored theme before first paint.
      (function () {
        try {
          var p = localStorage.getItem('docs:profile') || 'saas';
          // The profile's default theme applies until the visitor picks one (same table as the profiles).
          var fallback = { cms: 'light', pos: 'light', game: 'dark', ecommerce: 'light', landing: 'light' }[p] || 'system';
          var t = localStorage.getItem('ui:theme') || fallback;
          if (t === 'system') t = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          var d = document.documentElement;
          d.setAttribute('data-bs-theme', t);
          d.setAttribute('data-ui-profile', p);
          d.style.colorScheme = t;
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
